{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'academic_analytics/css/style.css' %}">
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100 bg-light">
        <div class="card p-5 shadow-lg rounded-4" style="max-width: 500px; width: 100%;">
            <h2 class="text-center mb-4 fw-bold">Create Account</h2>
            
            <form method="POST" action="{% url 'signup' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" class="form-control rounded-pill" id="username" name="username" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="first_name" class="form-label fw-semibold">First Name</label>
                        <input type="text" class="form-control rounded-pill" id="first_name" name="first_name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="last_name" class="form-label fw-semibold">Last Name</label>
                        <input type="text" class="form-control rounded-pill" id="last_name" name="last_name" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control rounded-pill" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="studentid" class="form-label fw-semibold">Student ID</label>
                    <input type="number" class="form-control rounded-pill" id="studentid" name="studentid" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary rounded-pill fw-semibold">Sign Up</button>
                </div>
            </form>

            <p class="mt-4 text-center text-muted">Already have an account? 
                <a href="/signin" class="text-primary text-decoration-none fw-semibold">Sign In</a>
            </p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
