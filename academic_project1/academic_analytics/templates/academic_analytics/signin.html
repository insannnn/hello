{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'academic_analytics/css/style.css' %}">
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100 bg-light">
        <div class="card p-5 shadow-lg rounded-4" style="max-width: 400px; width: 100%;">
            <h2 class="text-center mb-4 fw-bold">Sign In</h2>
            
            <form method="POST" action="{% url 'signin' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control rounded-pill" id="email" name="email" required>
                </div>

                <div class="mb-4">
                    <label for="studentid" class="form-label fw-semibold">Student ID</label>
                    <input type="number" class="form-control rounded-pill" id="studentid" name="studentid" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary rounded-pill fw-semibold">Sign In</button>
                </div>
            </form>

            <p class="mt-4 text-center text-muted">Don't have an account? 
                <a href="/signup" class="text-primary text-decoration-none fw-semibold">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
